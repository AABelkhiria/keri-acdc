[package]
name = "keri-acdc"
version = "0.1.0"
description = "ACDC credentials: the container, issuance and revocation events, and IPEX messages"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/AABelkhiria/keri-acdc"
documentation = "https://docs.rs/keri-acdc"
readme = "README.md"
keywords = ["keri", "acdc", "ipex", "credentials", "identity"]
categories = ["cryptography", "encoding"]
exclude = [".github/", "tools/", "deny.toml", "rustfmt.toml", "rust-toolchain.toml", ".gitignore"]

[dependencies]
keri-cesr = { version = "0.1.0", features = ["crypto"] }
keri-protocol = "0.1.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[[bench]]
name = "credential"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
